# .golangci.yml
version: "2"

run:
  timeout: 5m

linters:
  default: none

  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    - misspell
    - revive
    - whitespace
    - gocognit
    - nestif

  settings:
    errcheck:
      check-blank: true

    gocognit:
      min-complexity: 20

    nestif:
      min-complexity: 5

    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false

        - name: var-naming
          severity: warning
          disabled: false

  # Known complexity debt, waived per symbol rather than per file so that new
  # code in these same files is still held to the thresholds above. Each entry
  # is deleted as its function is split; an empty block is the exit criterion.
  exclusions:
    rules:
      - linters: [gocognit]
        text: 'WriteText|Block|scanFilesystem|SSHChecker\).Check|getPlatformSoftwareList'

      - linters: [gocognit]
        text: 'getMacOSUsers|getBSDUsers|getLinuxUsers|analyzeUsers|checkAuthConfig|checkSecurityConcerns'

      - linters: [nestif]
        text: 'if elevated|if len\(check\.Findings\) > 0|if sshdInstalled|if u\.osType'

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/papa0four/orkowatch

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  