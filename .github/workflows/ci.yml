name: CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'chore/**'
      - 'infrastructure/**'
      - 'docs/**'
      - 'test/**'
      - '[0-9]**'
  pull_request:
    branches:
      - dev
      - 'feature/**'
      - 'test/**'

jobs:
  classify:
    name: Classify Branch
    runs-on: ubuntu-latest
    outputs:
      run_vet:   ${{ steps.classify.outputs.run_vet }}
      run_lint:  ${{ steps.classify.outputs.run_lint }}
      run_tests: ${{ steps.classify.outputs.run_tests }}
      run_cross: ${{ steps.classify.outputs.run_cross }}
      run_shelllint: ${{ steps.classify.outputs.run_shelllint }}
      run_pslint:   ${{ steps.classify.outputs.run_pslint }}

    steps:
      - name: Determine branch type and set pipeline flags
        id: classify
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Detected branch: $BRANCH"

          if [[ "$BRANCH" == docs/* ]]; then
            echo "run_vet=false"       >> $GITHUB_OUTPUT
            echo "run_lint=false"      >> $GITHUB_OUTPUT
            echo "run_tests=false"     >> $GITHUB_OUTPUT
            echo "run_cross=false"     >> $GITHUB_OUTPUT
            echo "run_shelllint=false" >> $GITHUB_OUTPUT
            echo "run_pslint=false"    >> $GITHUB_OUTPUT

          elif [[ "$BRANCH" == infrastructure/* || "$BRANCH" == *infrastructure* ]]; then
            echo "run_vet=true"        >> $GITHUB_OUTPUT
            echo "run_lint=true"       >> $GITHUB_OUTPUT
            echo "run_tests=false"     >> $GITHUB_OUTPUT
            echo "run_cross=false"     >> $GITHUB_OUTPUT
            echo "run_shelllint=true"  >> $GITHUB_OUTPUT
            echo "run_pslint=true"     >> $GITHUB_OUTPUT

          elif [[ "$BRANCH" == test/* ]]; then
            echo "run_vet=true"        >> $GITHUB_OUTPUT
            echo "run_lint=true"       >> $GITHUB_OUTPUT
            echo "run_tests=true"      >> $GITHUB_OUTPUT
            echo "run_cross=false"     >> $GITHUB_OUTPUT
            echo "run_shelllint=true"  >> $GITHUB_OUTPUT
            echo "run_pslint=true"     >> $GITHUB_OUTPUT

          else
            echo "run_vet=true"        >> $GITHUB_OUTPUT
            echo "run_lint=true"       >> $GITHUB_OUTPUT
            echo "run_tests=true"      >> $GITHUB_OUTPUT
            echo "run_cross=true"      >> $GITHUB_OUTPUT
            echo "run_shelllint=true"  >> $GITHUB_OUTPUT
            echo "run_pslint=true"     >> $GITHUB_OUTPUT
          fi

  baseline:
    name: Baseline - Format / Built / Vet
    runs-on: ubuntu-latest
    needs: classify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        if: needs.classify.outputs.run_vet == 'true'
        run: go vet ./...

  makefile-lint:
    name: Makefile Lint and Format
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_lint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install checkmake
        run: |
          go install github.com/checkmake/checkmake/cmd/checkmake@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Validate Makefile syntax
        run: make -f Makefile help > /dev/null

      - name: Validate Makefile execution graph
        run: make -n build

      - name: Run checkmake
        run: checkmake Makefile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_lint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=5m

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_lint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Go Security Scan
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_lint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

  shell-lint:
    name: Shell Lint and Format
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_shelllint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL \
            "https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64" \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Run shfmt
        run: shfmt -ln bash -d scripts/linux

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning --shell=bash --format=tty scripts/linux/*.sh

      - name: Install shellharden
        run: |
          wget -qO shellharden.tar.gz \
            https://github.com/anordal/shellharden/releases/latest/download/shellharden-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf shellharden.tar.gz
          sudo mv shellharden /usr/local/bin/
          rm shellharden.tar.gz

      - name: Run shellharden
        run: shellharden --check scripts/linux/*.sh

  ps-lint:
    name: PowerShell Lint and Format
    runs-on: windows-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_pslint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./scripts/windows -Filter *.ps1 -Recurse
          $hasErrors = $false
          foreach ($file in $files) {
            $original  = Get-Content $file.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $original
            if ($formatted -ne $original) {
              Write-Host "[-] Formatting issue: $($file.Name)" -ForegroundColor Red
              $origLines = $original  -split "`n"
              $fmtLines = $formatted -split "`n"
              $diff = Compare-Object $origLines $fmtLines
              foreach ($line in $diff) {
                if ($line.SideIndicator -eq '<=') {
                  Write-Host "  - $($line.InputObject)" -ForegroundColor Red
                } else {
                  Write-Host "  + $($line.InputObject)" -ForegroundColor Green
                }
              }
              $hasErrors = $true
            }
          }
          if ($hasErrors) {
            Write-Error "Formatting issues found. Run Invoke-Formatter locally to fix."
            exit 1
          }
          Write-Host "[+] All PowerShell files are correctly formatted."

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Severity Error,Warning -Settings ./scripts/windows/.psscriptanalyzerconfig
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          }
          Write-Host "[+] PSScriptAnalyzer passed."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_tests == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

  cross-build:
    name: Cross-platform Build
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_cross == 'true'

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/owatch/main.go
