name: CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'chore/**'
      - 'infrastructure/**'
      - 'docs/**'
      - 'test/**'
      - '[0-9]**'
  pull_request:
    branches:
      - dev
      - 'feature/**'
      - 'test/**'

jobs:
  classify:
    name: Classify Branch
    runs-on: ubuntu-latest
    outputs:
      run_vet:   ${{ steps.classify.outputs.run_vet }}
      run_lint:  ${{ steps.classify.outputs.run_lint }}
      run_tests: ${{ steps.classify.outputs.run_tests }}
      run_cross: ${{ steps.classify.outputs.run_cross }}
      run_shelllint: ${{ steps.classify.outputs.run_shelllint }}
      run_pslint:   ${{ steps.classify.outputs.run_pslint }}

    steps:
      - name: Determine branch type and set pipeline flags
        id: classify
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Detected branch: $BRANCH"

          if [[ "$BRANCH" == docs/* ]]; then
            echo "run_vet=false"       >> $GITHUB_OUTPUT
            echo "run_lint=false"      >> $GITHUB_OUTPUT
            echo "run_tests=false"     >> $GITHUB_OUTPUT
            echo "run_cross=false"     >> $GITHUB_OUTPUT
            echo "run_shelllint=false" >> $GITHUB_OUTPUT
            echo "run_pslint=false"    >> $GITHUB_OUTPUT

          elif [[ "$BRANCH" == infrastructure/* || "$BRANCH" == *infrastructure* ]]; then
            echo "run_vet=true"    >> $GITHUB_OUTPUT
            echo "run_lint=true"   >> $GITHUB_OUTPUT
            echo "run_tests=false" >> $GITHUB_OUTPUT
            echo "run_cross=false" >> $GITHUB_OUTPUT

          elif [[ "$BRANCH" == test/* ]]; then
            echo "run_vet=true"    >> $GITHUB_OUTPUT
            echo "run_lint=true"   >> $GITHUB_OUTPUT
            echo "run_tests=true"  >> $GITHUB_OUTPUT
            echo "run_cross=false" >> $GITHUB_OUTPUT

          else
            echo "run_vet=true"        >> $GITHUB_OUTPUT
            echo "run_lint=true"       >> $GITHUB_OUTPUT
            echo "run_tests=true"      >> $GITHUB_OUTPUT
            echo "run_cross=true"      >> $GITHUB_OUTPUT
            echo "run_shelllint=true"  >> $GITHUB_OUTPUT
            echo "run_pslint=true"     >> $GITHUB_OUTPUT
          fi

  baseline:
    name: Baseline - Format / Built / Vet
    runs-on: ubuntu-latest
    needs: classify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        if: needs.classify.outputs.run_vet == 'true'
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_lint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  shell-lint:
    name: Shell Lint and Format
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_shelllint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: Check shell formatting
        run: shfmt -d linux/*.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './linux'
          severity: warning

  ps-lint:
    name: PowerShell Lint and Format
    runs-on: windows-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_pslint == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./windows -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $formatted = Invoke-Formatter -ScriptDefinition (Get-Content $file -Raw)
            $original  = Get-Content $file -Raw
            if ($formatted -ne $original) {
              Write-Error "Formatting issue in $($file.Name). Run Invoke-Formatter locally."
              exit 1
            }
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./windows -Recurse -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_tests == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

  cross-build:
    name: Cross-platform Build
    runs-on: ubuntu-latest
    needs: [classify, baseline]
    if: needs.classify.outputs.run_cross == 'true'

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/cpscan/main.go
